<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Entrar — Safemind</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,800;1,800&family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Bree+Serif&family=Playball&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />

    <link rel="stylesheet" href="auth.css" />
    <link rel="stylesheet" href="refinement.css" />
    <link rel="stylesheet" href="theme.css" />
    <script src="theme.js"></script>
    <link rel="stylesheet" href="brand-sections.css" />
      <link rel="stylesheet" href="password-ui.css" />
      <link rel="stylesheet" href="motion.css" />
    <script src="motion.js"></script>
  </head>
  <body>
    <div class="page-loader" id="page-loader" role="status" aria-live="polite">
      <span class="page-loader__spinner" aria-hidden="true"></span>
      <p class="page-loader__text" id="page-loader-text">Verificando sua sessão...</p>
    </div>
    <script>
      // Se o carregamento do Firebase falhar, não deixa a tela presa.
      setTimeout(function () {
        var l = document.getElementById("page-loader");
        if (l) l.classList.add("is-hidden");
      }, 6000);
    </script>

    <svg
      width="0"
      height="0"
      style="position: absolute"
      aria-hidden="true"
      focusable="false"
    >
      <defs>
        <path
          id="petal"
          d="M0 0 C-6 -5 -10 -9 -6.5 -13 C-3.5 -16 0 -13.5 0 -11 C0 -13.5 3.5 -16 6.5 -13 C10 -9 6 -5 0 0Z"
        />
        <symbol id="brand-mark" viewBox="-16 -16 32 32">
          <g fill="none" stroke-width="1.5" stroke-linejoin="round">
            <use href="#petal" stroke="#e6457f" />
            <use href="#petal" stroke="#f5b400" transform="rotate(90)" />
            <use href="#petal" stroke="#f0703a" transform="rotate(180)" />
            <use href="#petal" stroke="#7a52d1" transform="rotate(270)" />
          </g>
        </symbol>
      </defs>
    </svg>

    <header class="site-header">
      <div class="site-header__inner">
        <a class="logo" href="boas-vindas.html" aria-label="Safemind — página inicial">
          <img class="brand-image" src="brand-light.svg" alt="Safemind" />
        </a>

        <nav class="main-nav" aria-label="Principal">
          <ul>
            <li><a href="index.html">Área do paciente</a></li>
            <li><a href="boas-vindas.html#especialistas">Profissionais</a></li>
            <li><a href="psicologo.html">Sou psicólogo</a></li>
            <li><a href="boas-vindas.html#contato">Contato</a></li>
            <li><a href="sobre.html">Sobre nós</a></li>
          </ul>
        </nav>

        <div class="header-actions">
          <a class="btn btn--outline btn--sm" href="login.html" aria-current="page"
            >Entrar</a
          >
          <a class="btn btn--dark btn--sm" href="cadastro.html">Cadastrar</a>
        </div>
      </div>
    </header>

    <main class="auth">
      <div class="auth__head">
        <a class="auth__back" href="boas-vindas.html">
          <svg viewBox="0 0 8 10" aria-hidden="true">
            <path d="M7 1 1 5l6 4z" fill="currentColor" />
          </svg>
          Voltar
        </a>
        <h1 class="auth__title">Entrar na sua conta</h1>
        <p class="auth__lead">Acesse para acompanhar seus matchs e suas consultas.</p>
      </div>

      <div class="auth__card">
        <button class="auth-google" type="button" id="google-btn">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path
              fill="#EA4335"
              d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"
            />
            <path
              fill="#4285F4"
              d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"
            />
            <path
              fill="#FBBC05"
              d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"
            />
            <path
              fill="#34A853"
              d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"
            />
          </svg>
          Entrar com o Google
        </button>

        <div class="auth__divider"><span>ou entre com e-mail</span></div>

        <form class="auth-form" id="login-form" novalidate>
          <div class="auth-field">
            <label for="email">Email</label>
            <input
              id="email"
              name="email"
              type="email"
              placeholder="seu@email.com"
              autocomplete="email"
              required
            />
          </div>

          <div class="auth-field">
            <label for="senha">Senha</label>
            <input
              id="senha"
              name="senha"
              type="password"
              placeholder="Sua senha"
              autocomplete="current-password"
              required
            />
            <button class="auth__forgot" type="button" id="reset-link">
              Esqueci minha senha
            </button>
          </div>

          <p
            class="auth__message auth__message--error"
            id="form-error"
            role="alert"
            hidden
          ></p>
          <p
            class="auth__message auth__message--status"
            id="form-status"
            role="status"
            hidden
          ></p>

          <button class="btn btn--dark auth-form__submit" type="submit" id="login-submit">
            Entrar
          </button>
        </form>

        <p class="auth__switch">
          Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a>
        </p>
      </div>
    </main>

    <script type="module" src="login.js"></script>
      <script type="module" src="password-ui.js"></script>
  </body>
</html>
